# Productie: aplicatia + Caddy (HTTPS automat) + cron pentru facturi.
# Pornire: cp .env.production.example .env  (completeaza)  &&  docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - vlm-data:/app/.data   # rezervari, recenzii, audit: NU sterge acest volum
    expose: ["3100"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

  invoices:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    depends_on: [app]
    entrypoint: ["/bin/sh", "-c"]
    # la ~5 min trimite facturile scadente (plata confirmata + 5 min)
    command: ['while true; do sleep 300; curl -fsS -X POST -H "x-cron-secret: $$VLM_CRON_SECRET" http://app:3100/api/cron/invoices || echo "invoice cron failed"; echo; done']

volumes:
  vlm-data:
  caddy-data:
  caddy-config:
